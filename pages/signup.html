<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun - EduConnect</title>

  <!-- Google Fonts: Poppins & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.2 & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Project Stylesheets -->
  <link rel="stylesheet" href="../css/components/common.css?v=2.2">
  <link rel="stylesheet" href="../css/pages/auth.css?v=2.2">
</head>
<body class="auth-page-body">

  <main class="auth-wrapper">
    <div class="auth-container">
      
      <!-- ===================================================================
           LEFT COLUMN: Welcome Card (Rectangle 100 Simetri Miring & Illustration)
           =================================================================== -->
      <section class="auth-banner-card signup-card" aria-label="Informasi EduConnect">
        <!-- Slanted Shape SVG Background (Rectangle 100 Simetri Miring) -->
        <svg class="auth-card-bg-shape" viewBox="0 0 635 940" preserveAspectRatio="none" aria-hidden="true">
          <path d="M 0 30 A 30 30 0 0 1 30 0 L 605 0 A 30 30 0 0 1 632 28 L 553 912 A 30 30 0 0 1 525 940 L 30 940 A 30 30 0 0 1 0 910 Z" fill="#DBEAFE"/>
        </svg>

        <div class="auth-illus-area">
          <img 
            src="../assets/images/character.png"
            alt="Ilustrasi siswa belajar dan berkolaborasi di EduConnect" 
            class="auth-illus-img"
          >
        </div>
        <div class="auth-banner-text-block">
          <h2 class="auth-banner-title">Selamat Datang di Ruang Belajarmu!</h2>
          <p class="auth-banner-desc">
            Jelajahi pengetahuan baru, berbagi ide, ajukan pertanyaan, dan berkembang bersama EduConnect.
          </p>
        </div>
      </section>

      <!-- ===================================================================
           RIGHT COLUMN: Sign Up Form
           =================================================================== -->
      <section class="auth-form-column" aria-label="Formulir Pendaftaran">
        <div class="auth-form-inner">

          <!-- Brand Logo / Back to Dashboard -->
          <a href="../index.html" class="auth-brand-badge" title="Kembali ke Beranda EduConnect">
            <div class="logo-box">
              <i class="bi bi-mortarboard-fill"></i>
            </div>
            <span class="logo-text">EduConnect</span>
            <span class="back-hint ms-2">
              <i class="bi bi-arrow-left"></i> Beranda
            </span>
          </a>

          <!-- Alert Notification Area -->
          <div id="authAlert" class="auth-alert-notification" role="alert"></div>

          <!-- Form Header -->
          <h1 class="auth-heading">Selamat Datang</h1>

          <!-- Form -->
          <form id="signupForm" novalidate>
            
            <!-- Nama Lengkap -->
            <div class="auth-field">
              <label for="signupName" class="auth-label">Nama Lengkap</label>
              <div class="auth-input-wrapper">
                <input 
                  type="text" 
                  id="signupName" 
                  name="fullName" 
                  class="auth-control" 
                  placeholder="Masukkan nama lengkap kamu" 
                  required
                  autocomplete="name"
                >
              </div>
            </div>

            <!-- Email Address -->
            <div class="auth-field">
              <label for="signupEmail" class="auth-label">Email Address</label>
              <div class="auth-input-wrapper">
                <input 
                  type="email" 
                  id="signupEmail" 
                  name="email" 
                  class="auth-control" 
                  placeholder="Masukkan email aktif kamu" 
                  required
                  autocomplete="email"
                >
              </div>
            </div>

            <!-- Jenjang Pendidikan (SMP / SMA-SMK per PRD) -->
            <div class="auth-field">
              <label for="signupLevel" class="auth-label">Jenjang Pendidikan</label>
              <div class="auth-input-wrapper">
                <select id="signupLevel" name="educationLevel" class="auth-control auth-select" required>
                  <option value="" disabled selected hidden>Pilih jenjang pendidikan</option>
                  <option value="smp">SMP (Sekolah Menengah Pertama)</option>
                  <option value="sma_smk">SMA/SMK (Sekolah Menengah Atas / Kejuruan)</option>
                </select>
              </div>
            </div>

            <!-- Password -->
            <div class="auth-field">
              <label for="signupPassword" class="auth-label">Password</label>
              <div class="auth-input-wrapper auth-password-wrapper">
                <input 
                  type="password" 
                  id="signupPassword" 
                  name="password" 
                  class="auth-control" 
                  placeholder="Buat password" 
                  required
                  minlength="6"
                  autocomplete="new-password"
                >
                <button 
                  type="button" 
                  class="auth-toggle-btn" 
                  data-target="signupPassword" 
                  aria-label="Tampilkan password"
                  tabindex="-1"
                >
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <!-- Konfirmasi Password -->
            <div class="auth-field">
              <label for="signupConfirmPassword" class="auth-label">Konfirmasi Password</label>
              <div class="auth-input-wrapper auth-password-wrapper">
                <input 
                  type="password" 
                  id="signupConfirmPassword" 
                  name="confirmPassword" 
                  class="auth-control" 
                  placeholder="Masukkan ulang password" 
                  required
                  minlength="6"
                  autocomplete="new-password"
                >
                <button 
                  type="button" 
                  class="auth-toggle-btn" 
                  data-target="signupConfirmPassword" 
                  aria-label="Tampilkan password"
                  tabindex="-1"
                >
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <div id="confirmPasswordFeedback" class="auth-feedback-msg"></div>
            </div>

            <!-- Tombol Daftar -->
            <button type="submit" id="signupSubmitBtn" class="auth-submit-btn">
              Daftar
            </button>

            <!-- Link Pindah ke Login -->
            <p class="auth-switch-prompt">
              Sudah punya akun?
              <a href="login.html" class="auth-switch-link">Masuk sekarang</a>
            </p>

          </form>

        </div>
      </section>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/auth.js?v=2.2"></script>
</body>
</html>
