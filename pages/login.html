<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - EduConnect</title>

  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  
  <link rel="stylesheet" href="../css/components/common.css?v=2.2">
  <link rel="stylesheet" href="../css/pages/auth.css?v=2.2">
</head>
<body class="auth-page-body">

  <main class="auth-wrapper">
    <div class="auth-container auth-layout-login">

      
      <section class="auth-form-column" aria-label="Formulir Masuk">
        <div class="auth-form-inner">

          
          <a href="../index.html" class="auth-brand-badge" title="Kembali ke Beranda EduConnect">
            <div class="logo-box">
              <i class="bi bi-mortarboard-fill"></i>
            </div>
            <span class="logo-text">EduConnect</span>
            <span class="back-hint ms-2">
              <i class="bi bi-arrow-left"></i> Beranda
            </span>
          </a>

          
          <div id="authAlert" class="auth-alert-notification" role="alert"></div>

          
          <h1 class="auth-heading">Selamat Datang Kembali</h1>
          <p class="auth-subheading">Masuk ke akun EduConnect untuk melanjutkan perjalanan belajarmu.</p>

          
          <form id="loginForm" novalidate>

            
            <div class="auth-field">
              <label for="loginEmail" class="auth-label">Email Address</label>
              <div class="auth-input-wrapper">
                <input 
                  type="email" 
                  id="loginEmail" 
                  name="email" 
                  class="auth-control" 
                  placeholder="Masukkan email aktif kamu" 
                  required
                  autocomplete="email"
                >
              </div>
            </div>

            
            <div class="auth-field">
              <label for="loginPassword" class="auth-label">Password</label>
              <div class="auth-input-wrapper auth-password-wrapper">
                <input 
                  type="password" 
                  id="loginPassword" 
                  name="password" 
                  class="auth-control" 
                  placeholder="Masukkan password kamu" 
                  required
                  autocomplete="current-password"
                >
                <button 
                  type="button" 
                  class="auth-toggle-btn" 
                  data-target="loginPassword" 
                  aria-label="Tampilkan password"
                  tabindex="-1"
                >
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            
            <div class="auth-options-bar">
              <label class="auth-remember-check">
                <input type="checkbox" id="rememberMe">
                <span>Ingat saya</span>
              </label>
              <a href="#" class="auth-forgot-link">Lupa password?</a>
            </div>

            
            <button type="submit" id="loginSubmitBtn" class="auth-submit-btn">
              Masuk
            </button>

            
            <div class="auth-divider-line">
              <span>ATAU</span>
            </div>

            
            <button type="button" id="googleSignInBtn" class="auth-google-btn">
              <svg class="auth-google-icon" viewBox="0 0 24 24" width="20" height="20">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15Z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z"/>
              </svg>
              <span>Lanjutkan dengan Google</span>
            </button>

            
            <p class="auth-switch-prompt">
              Belum punya akun?
              <a href="signup.html" class="auth-switch-link">Daftar sekarang</a>
            </p>

          </form>

        </div>
      </section>

      
      <section class="auth-banner-card login-card" aria-label="Informasi EduConnect">
        
        <svg class="auth-card-bg-shape" viewBox="0 0 635 940" preserveAspectRatio="none" aria-hidden="true">
          <path d="M 31 0 L 605 0 A 30 30 0 0 1 635 30 L 635 910 A 30 30 0 0 1 605 940 L 110 940 A 30 30 0 0 1 82 912 L 3 28 A 30 30 0 0 1 31 0 Z" fill="#DBEAFE"/>
        </svg>

        <div class="auth-illus-area">
          <img 
            src="../assets/images/character.png"
            alt="Ilustrasi siswa belajar dan berkolaborasi di EduConnect" 
            class="auth-illus-img"
          >
        </div>
        <div class="auth-banner-text-block">
          <h2 class="auth-banner-title">Selamat Datang di Ruang Belajarmu!</h2>
          <p class="auth-banner-desc">
            Jelajahi pengetahuan baru, berbagi ide, ajukan pertanyaan, dan berkembang bersama EduConnect.
          </p>
        </div>
      </section>

    </div>
  </main>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/auth.js?v=2.2"></script>
</body>
</html>
