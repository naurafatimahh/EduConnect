<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profil - EduConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar sticky-top">
    <div class="topbar-inner d-flex align-items-center justify-content-between px-4">
      <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none logo-link">
        <div class="logo-box"><i class="bi bi-mortarboard-fill text-white"></i></div>
        <span class="logo-text">EduConnect</span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <a href="#" class="nav-icon-btn" title="Notifikasi" aria-label="Notifikasi"><i class="bi bi-bell"></i></a>
        <a href="profile.html" class="profile-circle" title="Profil Saya" aria-label="Profil Saya"><i class="bi bi-person"></i></a>
      </div>
    </div>
  </header>

  <div class="dashboard-body">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <ul class="nav flex-column gap-2">
          <li class="nav-item"><a class="nav-link menu-item" href="index.html"><i class="bi bi-house-door"></i><span>Beranda</span></a></li>
          <li class="nav-item"><a class="nav-link menu-item" href="#"><i class="bi bi-book"></i><span>Materi &amp; Pertanyaan</span></a></li>
          <li class="nav-item"><a class="nav-link menu-item" href="forum.html"><i class="bi bi-chat-left-text"></i><span>Forum</span></a></li>
          <li class="nav-item"><a class="nav-link menu-item active" href="profile.html"><i class="bi bi-person-fill"></i><span>Profil</span></a></li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <div class="content-container edit-profile-page">
        <div class="profile-heading">
          <h1>Edit Profil</h1>
          <p>Kelola informasi pribadi dan profil belajarmu.</p>
        </div>

        <section class="edit-profile-panel panel-card">
          <div class="photo-column">
            <div class="photo-preview" id="photoPreview"><i class="bi bi-person"></i></div>
            <label class="photo-button" for="photoInput">Ganti Foto</label>
            <input type="file" id="photoInput" accept="image/jpeg,image/png" hidden>
            <p>JPG atau PNG<br>Maksimal 2 MB</p>
          </div>

          <form class="edit-profile-form" id="profileForm">
            <div class="edit-form-grid">
              <div class="edit-field">
                <label for="fullName">Nama lengkap</label>
                <input type="text" id="fullName" class="form-control" required>
              </div>
              <div class="edit-field">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" required>
              </div>
              <div class="edit-field full">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" required>
              </div>
              <div class="edit-field">
                <label for="level">Tingkat sekolah</label>
                <select id="level" class="form-select" required>
                  <option value="">Pilih tingkat sekolah</option>
                  <option>SMP</option>
                  <option>SMA/SMK</option>
                </select>
              </div>
              <div class="edit-field">
                <label for="schoolClass">Kelas</label>
                <select id="schoolClass" class="form-select" required>
                  <option value="">Pilih kelas</option>
                  <option>Kelas 7</option><option>Kelas 8</option><option>Kelas 9</option>
                  <option>Kelas 10</option><option>Kelas 11</option><option>Kelas 12</option>
                </select>
              </div>
              <div class="edit-field full">
                <label for="school">Nama sekolah</label>
                <input type="text" id="school" class="form-control">
              </div>
              <div class="edit-field full">
                <label for="bio">Bio singkat</label>
                <textarea id="bio" class="form-control" rows="3"></textarea>
              </div>
            </div>
            <div class="edit-form-footer">
              <a href="profile.html" class="profile-cancel-button">Batal</a>
              <button type="submit" class="profile-save-button">Simpan Perubahan</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <div class="profile-toast" id="profileToast" role="status" aria-live="polite">
    <i class="bi bi-check-circle-fill"></i><span>Profil berhasil disimpan.</span>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
